[global]
module = 'jupyter_client'
submodules = ['asynchronous', 'blocking', 'ioloop', 'provisioning', 'ssh']
exec_failure = 'fallback'
docs_path = "~/dev/jupyter_client/docs"
execute_doctests = false
exclude = []
# ``docs/api/`` is a sphinx-apidoc dump (``.. automodule::`` stubs); it has no
# prose and duplicates what gen already collects from the package itself.
narrative_exclude = [
    "api",
    "_build",
]

[global.directives]
automodule   = 'papyri.directives:warn'
autoclass    = 'papyri.directives:warn'
automethod   = 'papyri.directives:warn'

[meta]
github_slug = 'jupyter/jupyter_client'
tag = 'v{version}'
pypi = 'jupyter-client'
homepage = 'https://jupyter.org/'
docspage = 'https://jupyter-client.readthedocs.org/'
