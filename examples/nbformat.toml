[global]
module = 'nbformat'
submodules = ['v1', 'v2', 'v3', 'v4']
exec_failure = 'fallback'
docs_path = "~/dev/nbformat/docs"
execute_doctests = false
exclude = []
narrative_exclude = [
    "_build",
]

[global.directives]
automodule   = 'papyri.directives:warn'
autoclass    = 'papyri.directives:warn'
automethod   = 'papyri.directives:warn'

[meta]
github_slug = 'jupyter/nbformat'
tag = 'v{version}'
pypi = 'nbformat'
homepage = 'https://jupyter.org/'
docspage = 'https://nbformat.readthedocs.org/'
